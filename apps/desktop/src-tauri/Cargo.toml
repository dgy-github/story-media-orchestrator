[package]
name = "story-media-orchestrator-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
uuid = { version = "1", features = ["v4"] }


rfd = "0.15"

story-core = { path = "../../../../microcodex-short-drama-studio/crates/story-core" }
story-runtime = { path = "../../../../microcodex-short-drama-studio/crates/story-runtime" }
story-provider = { path = "../../../../microcodex-short-drama-studio/crates/story-provider" }
tokio = { version = "1", features = ["sync"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
