  </defs>
  <rect width="1040" height="260" rx="16" fill="#0d1428"/>
  <rect x="20" y="30" width="165" height="96" rx="14" fill="url(#gBlue)" stroke="#56b6f7" stroke-width="1.5"/>
  <text x="102" y="62" text-anchor="middle" fill="#a9dcff" font-size="12" font-weight="700">STEP 1 · 立项预演</text>
  <text x="102" y="86" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">拆镜 + 剧本预演</text>
  <text x="102" y="108" text-anchor="middle" fill="#9eb0d6" font-size="12">project.json</text>
  <line x1="185" y1="78" x2="225" y2="78" stroke="#56b6f7" stroke-width="2" marker-end="url(#arrow)"/>

