  <text x="315" y="108" text-anchor="middle" fill="#9eb0d6" font-size="12">本地预览 / MCP 注入</text>
  <line x1="403" y1="78" x2="443" y2="78" stroke="#56b6f7" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="446" y="30" width="180" height="96" rx="14" fill="url(#gPurple)" stroke="#7c6cff" stroke-width="1.5"/>
  <text x="536" y="62" text-anchor="middle" fill="#c7bfff" font-size="12" font-weight="700">STEP 3 · 多模态质检</text>
