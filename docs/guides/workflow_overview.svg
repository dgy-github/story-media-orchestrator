  <text x="536" y="108" text-anchor="middle" fill="#9eb0d6" font-size="12">硬门前置 + 大模型审片</text>
  <line x1="626" y1="78" x2="666" y2="78" stroke="#56b6f7" stroke-width="2" marker-end="url(#arrow)"/>

